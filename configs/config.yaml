defaults:
  - _self_
  - env: cartpole
  - agent: ppo
  - unlearn: trajectory_selective
  - logging: tensorboard

# Experiment settings
seed: 42
device: auto  # auto, cpu, cuda

# Deterministic naming: {env}_{agent}_seed{seed}
# Training outputs go to: experiments/{checkpoints,logs,outputs}/{experiment_name}/
# Unlearning outputs nest under the same experiment with method suffix
experiment_name: ${env_name}_${name}_seed${seed}

# Training
training:
  total_timesteps: 500_000
  eval_frequency: 10_000
  save_frequency: 50_000
  num_eval_episodes: 10
  checkpoint_dir: experiments/checkpoints/${experiment_name}

# Unlearning
unlearning:
  enabled: false
  start_timestep: 500_000
  frequency: 10_000

# Logging
output_dir: experiments/outputs/${experiment_name}
log_dir: experiments/logs/${experiment_name}
save_video: false

# Hydra settings
hydra:
  run:
    dir: experiments/hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: experiments/hydra_logs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
