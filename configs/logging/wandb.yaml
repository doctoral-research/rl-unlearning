# @package _global_
backend: wandb
log_frequency: 100

wandb:
  enabled: true
  project: rl-unlearning
  entity: getlar-team
  group: null
  job_type: train
  tags: []
  notes: null
  
  # Wandb config
  mode: online  # online, offline, disabled
  save_code: true
  
# Metrics (same as tensorboard)
metrics:
  - episode_reward
  - episode_length
  - policy_loss
  - value_loss
  - entropy
  - learning_rate
  - explained_variance

unlearning_metrics:
  - forget_effectiveness
  - retain_stability
  - selectivity
  - aufc
  - privacy_auc

# Video recording
video:
  enabled: true
  frequency: 50000
  length: 1
