# @package _global_
method: strategy_inversion
unlearn_name: strategy_inversion

# Unlearning optimizer (separate from training optimizer)
unlearn_lr: 3e-4
retain_stability_threshold: 0.5
num_unlearn_steps: 2000
eval_frequency: 100

# Core parameters
num_seeds: 100  # Number of seed optimizations
num_iterations: 50  # Optimization iterations per seed
search_lr: 0.01  # LR for state optimization (NOT for policy updates)

# Policy-guided search
search:
  method: gradient_based  # gradient_based, random, evolutionary
  temperature: 1.0
  noise_scale: 0.1

# Synthetic state generation
generation:
  sample_around_policy: true
  diversity_weight: 0.1
  coverage_threshold: 0.7

# Target region identification
target_region:
  method: policy_gradient  # policy_gradient, value_based
  region_size: 1000
  expansion_factor: 1.5

# Negative signal application
negative_signal:
  strength: 1.0
  apply_to_neighbors: true
  neighbor_radius: 0.1
