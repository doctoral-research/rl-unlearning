# @package _global_
method: retain_protection
unlearn_name: retain_protection

# Metaplasticity masks
metaplasticity:
  enabled: true
  mask_type: importance  # importance, gradient, activation
  update_frequency: 1000
  threshold: 0.5
  consolidation_strength: 0.9

# Selective distillation
distillation:
  enabled: true
  teacher_update_frequency: 5000  # Timesteps between teacher updates
  temperature: 2.0
  alpha: 0.5  # Weight of distillation loss
  only_retain_states: true

# Elastic weight consolidation (EWC)
ewc:
  enabled: false
  lambda_ewc: 1000.0
  fisher_sample_size: 1000

# Synaptic intelligence
synaptic_intelligence:
  enabled: false
  c: 0.1
  damping: 0.1

# Retain stability monitoring
stability:
  check_frequency: 1000
  threshold: 0.1  # Max allowed degradation
  adaptive_weights: true
