# @package _global_
method: retain_protection
unlearn_name: retain_protection

# Unlearning optimizer (separate from training optimizer)
# Higher LR than others — masks protect important params so we can push harder
unlearn_lr: 3e-4
retain_stability_threshold: 0.5
num_unlearn_steps: 2000
eval_frequency: 100

# Metaplasticity masks
metaplasticity:
  enabled: true
  mask_type: importance  # importance, gradient, activation
  update_frequency: 250  # Update masks frequently for adaptive protection
  threshold: 0.7  # Protect only the top 30% most important params
  consolidation_strength: 0.9

# Selective distillation
distillation:
  enabled: true
  teacher_update_frequency: 5000  # Timesteps between teacher updates
  temperature: 2.0
  alpha: 0.2  # Low distillation weight — let forgetting proceed, masks do the protection
  only_retain_states: true

# Elastic weight consolidation (EWC)
ewc:
  enabled: false
  lambda_ewc: 1000.0
  fisher_sample_size: 1000

# Synaptic intelligence
synaptic_intelligence:
  enabled: false
  c: 0.1
  damping: 0.1

# Retain stability monitoring
stability:
  check_frequency: 1000
  threshold: 0.1  # Max allowed degradation
  adaptive_weights: true
