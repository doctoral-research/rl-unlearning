# @package _global_
env_name: fourrooms
env_id: MiniGrid-FourRooms-v0
# Obs = [agent_x, agent_y, direction] + FlatObsWrapper symbolic encoding.
# FlatObs is 2835 dims (7*7*N_objects*N_colors*N_states + ...). Total 2838.
observation_dim: 2838
# Discrete(7): left, right, forward, pickup, drop, toggle, done
action_dim: 7
action_type: discrete

# Use MiniGrid's symbolic FlatObs encoding (one-hot tiles) plus pose
# prefix. Raw 7x7x3 RGB is hostile to MLPs; symbolic is what SB3-zoo
# uses to solve FourRooms with vanilla PPO.
obs_encoding: symbolic

# Pin the goal at the top-right room (13, 3) so the "avoid bottom-right"
# scenario is well-defined for every episode. Without this, FourRooms
# randomises the goal and ~19% of seeds place it inside the forget zone,
# making the unlearning task ill-posed for those episodes.
fixed_goal_pos: [13, 3]

# Canonical SB3-zoo recipe for FourRooms (eval reward ~0.5 at 5M steps,
# https://huggingface.co/sb3/ppo-MiniGrid-FourRooms-v0). Vanilla PPO is
# enough — no exploration bonus needed once the obs encoding is right.
training:
  total_timesteps: 5_000_000
  eval_frequency: 50_000
