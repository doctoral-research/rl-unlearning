# @package _global_
env_name: pendulum
env_id: Pendulum-v1
# Obs = [cos_theta, sin_theta, theta_dot]; theta_dot in [-8, 8].
observation_dim: 3
action_dim: 1
action_type: continuous

# Pendulum has dense reward = -(theta^2 + 0.1*theta_dot^2 + 0.001*a^2).
# Default PPO (gamma=0.99, lr=3e-4) gets stuck at ~-1300. SB3 rl-zoo
# recipe uses gamma=0.9 (Pendulum is effectively a short-horizon task),
# higher lr, and 1M+ timesteps. We mirror that here.
gamma: 0.9
learning_rate: 1.0e-3
n_steps: 1024
normalize_obs: true  # Pendulum has wildly different obs-dim scales
# gSDE (Raffin 2021): temporally-correlated exploration. Required for
# vanilla single-env PPO on Pendulum per SB3 rl-zoo.
use_sde: true
sde_sample_freq: 4
sde_log_std_init: 0.0   # was -2 (too little noise); SB3 default for continuous control
tanh_squash: true       # bounded actions without gradient-killing hard clip
action_scale: 2.0       # Pendulum action range is [-2, 2], not [-1, 1] like HalfCheetah

training:
  total_timesteps: 500_000
  eval_frequency: 20_000
