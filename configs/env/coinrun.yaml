# @package _global_
env_name: coinrun
env_id: procgen
procgen_env: coinrun
procgen_distribution_mode: easy
procgen_num_levels: 0

observation_dim: 12288
action_dim: 15
action_type: discrete
use_conv: true

gamma: 0.999
gae_lambda: 0.95
learning_rate: 5.0e-4
n_steps: 256
entropy_coef: 0.01
clip_epsilon: 0.2
n_epochs: 3
batch_size: 2048
max_grad_norm: 0.5
value_coef: 0.5

training:
  total_timesteps: 5_000_000
  eval_frequency: 100_000
