# @package _global_
env_name: empty8x8
env_id: MiniGrid-Empty-8x8-v0
# Obs = [agent_x, agent_y, direction, flat 7x7x3 partial-view] = 150
observation_dim: 147
# Scenarios read agent pose through a FeatureView (scenarios.views),
# which introspects the env, so the policy no longer needs privileged
# absolute position in its observation. Set include_pos: true to load
# pre-Stage-0 checkpoints (obs_dim 150).
include_pos: false
# Scenario predicates resolve through the MiniGrid env view.
scenario_view: minigrid

action_dim: 7
action_type: discrete

# Empty-8x8 is dense-enough (step penalty) for vanilla PPO to solve quickly.
training:
  total_timesteps: 500_000
  eval_frequency: 5_000
