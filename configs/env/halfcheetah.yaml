# @package _global_
env_name: halfcheetah
env_id: HalfCheetah-v5
# Obs: 17-dim continuous (position + velocity of joints; rootz not included).
# Action: 6-dim continuous torque in [-1, 1].
observation_dim: 17
action_dim: 6
action_type: continuous

# HalfCheetah is dense-reward (forward velocity + control cost) so it's
# much easier than Pendulum/MountainCar. Default PPO + standard hyperparams
# should suffice for a usable baseline.
gamma: 0.99
gae_lambda: 0.95
learning_rate: 3.0e-4
n_steps: 2048
normalize_obs: true  # MuJoCo envs benefit from obs normalization
use_sde: true        # Standard for MuJoCo continuous control
sde_sample_freq: 4
sde_log_std_init: 0.0  # SB3 default for HalfCheetah (was -2 = too little noise)
tanh_squash: true      # bounded actions without gradient-killing hard clip

training:
  total_timesteps: 1_500_000
  eval_frequency: 30_000
