# @package _global_
name: a2c
algorithm: A2C

# Network architecture
network:
  hidden_dims: [64, 64]
  activation: tanh
  ortho_init: true
  
# A2C specific
gamma: 0.99
gae_lambda: 0.95
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# Training
n_steps: 5
batch_size: null  # Uses all collected steps
learning_rate: 0.0007
lr_scheduler: null

# Optimizer
optimizer: rmsprop
rmsprop_eps: 1e-5
rmsprop_alpha: 0.99
