# @package _global_
name: ppo
algorithm: PPO

# Network architecture
network:
  hidden_dims: [64, 64]
  activation: tanh
  ortho_init: true
  
# PPO specific
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
clip_value: true
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# Training
n_steps: 2048
n_epochs: 10
batch_size: 64
learning_rate: 0.0003
lr_scheduler: null  # linear, cosine, null

# Optimizer
optimizer: adam
adam_eps: 1e-5
