name: avoid_right_half
description: >
  Forget "go-right-first" paths. The Empty-8x8 layout has the agent
  starting at (1, 1) and the goal at (6, 6). The natural optimal path
  travels through the right half. After unlearning, the agent should
  take the L-shape via the bottom-left, touching the right half only
  at the final approach to the goal.

  Visually obvious before-vs-after: occupancy heatmaps should shift
  from a top-right cluster to a bottom-left cluster.
env_id: MiniGrid-Empty-8x8-v0

match_mode: proportion
match_threshold: 0.15

# Obs layout (see src/utils/env_wrappers.py MiniGridFlatPos):
#   dim 0 = agent_x, dim 1 = agent_y, dim 2 = direction.
# Empty-8x8 is 8x8 with walls at x in {0, 7} and y in {0, 7}.
# Right half = x in [4, 6].
groups:
  - name: right_half
    conditions:
      - dim: 0
        dim_name: agent_x
        op: ">"
        value: 3.5
        target: state
