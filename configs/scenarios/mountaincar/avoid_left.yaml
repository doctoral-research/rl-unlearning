name: avoid_left
description: >
  Forget the leftmost positions (position < -1.0). MountainCar's optimal
  policy requires swinging far left to build momentum before reaching the
  goal at position >= 0.5, so this forget region is *structurally
  necessary* for task completion. After unlearning, the agent can no
  longer rely on the deep-left swing; it must find an alternative way to
  build momentum (impossible without going left enough, so partial-credit
  policies emerge). The relearn attack tests whether suppression survives
  PPO's strong gradient signal pulling the agent back toward the
  optimal-by-physics left-swing path.

  Stronger reward-aligned forget than gridworld avoidance: in
  fourrooms/empty8x8 the forget region is *convenient*; here it is
  *required* for high reward.
env_id: MountainCar-v0
match_mode: proportion
match_threshold: 0.05

# obs: [position, velocity]
groups:
  - name: deep_left
    conditions:
      - dim: 0
        dim_name: position
        op: "<"
        value: -1.0
        target: state
