name: no_right_push
description: >
  Forget the "push right" action when the pole is leaning left. After
  unlearning, the agent should never push right when the pole angle is negative
  (leaning left). This is an action-conditioned scenario -- it targets a
  specific state-action pair rather than a state region.
env_id: CartPole-v1

# Forget trajectories that frequently push right while pole leans left.
# Using proportion mode because the corrective push-right is very common --
# any_step would catch nearly every trajectory.
match_mode: proportion
match_threshold: 0.02

# obs: [cart_position, cart_velocity, pole_angle, pole_angular_velocity]
# actions: 0=push_left, 1=push_right
groups:
  - name: right_push_while_leaning_left
    conditions:
      - dim: 2
        dim_name: pole_angle
        op: "<"
        value: -0.08
        target: state
      - dim: 0
        dim_name: push_right
        op: "=="
        value: 1
        target: action
