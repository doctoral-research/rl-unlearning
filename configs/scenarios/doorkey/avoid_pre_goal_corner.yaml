name: avoid_pre_goal_corner
description: >
  Forget a 2x2 region in the right room directly above-left of the goal
  at (6, 6): cells (5, 4), (5, 5), (6, 4), (6, 5). The goal is reachable
  both via this region ("right-then-down" path) and via the bottom edge
  ("down-then-right" path). After unlearning, the agent should prefer
  the bottom-edge route, but PPO under attack will want to recover the
  more direct route through the forget region because it is slightly
  shorter and DoorKey reward decreases with episode length.

  Goal reachability: yes (bottom-edge route).
  Reward-aligned: yes (forget region is on the shorter natural path).
  Split robustness: the forget region is always within the right room
  for all DoorKey-8x8 split positions in {2, 3, 4, 5}. When split=5,
  cells at x=5 are unreachable but the x=6 cells remain in the right
  room, so the region degenerates from 2x2 to 1x2 in that case.
env_id: MiniGrid-DoorKey-8x8-v0
match_mode: proportion
match_threshold: 0.15

groups:
  - name: pre_goal_corner
    conditions:
      - dim: 0
        dim_name: agent_x
        op: ">"
        value: 4.5
        target: state
      - dim: 0
        dim_name: agent_x
        op: "<"
        value: 6.5
        target: state
      - dim: 1
        dim_name: agent_y
        op: ">"
        value: 3.5
        target: state
      - dim: 1
        dim_name: agent_y
        op: "<"
        value: 5.5
        target: state
