name: avoid_top_half
description: >
  Forget being in the top half of the 8x8 grid (y <= 3). DoorKey requires
  pick up key (left half) -> open door (mid wall) -> reach goal
  (right half). The key spawn and the agent start can land anywhere in
  the left half, so trajectories regularly traverse the top half. Forget
  region is non-essential: the agent can reach the goal entirely via the
  bottom half if the key spawned there.

  Tests Brittle Unlearning in a *multi-stage* task: the unlearning has
  to survive interactions with the pickup-key and open-door subtasks,
  not just one navigation objective.
env_id: MiniGrid-DoorKey-8x8-v0
match_mode: proportion
match_threshold: 0.1

# obs: [agent_x, agent_y, direction, ...]
groups:
  - name: top_half
    conditions:
      - dim: 1
        dim_name: agent_y
        op: "<="
        value: 3
        target: state
