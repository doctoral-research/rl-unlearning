version: '3.8'

services:
  rl-unlearning:
    build:
      context: .
      dockerfile: docker/Dockerfile.GPU
    image: rl-unlearning:gpu
    container_name: rl-unlearning
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace/src
      - HYDRA_FULL_ERROR=1
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - WANDB_ENTITY=${WANDB_ENTITY:-}
      - WANDB_PROJECT=${WANDB_PROJECT:-}
      - HOME=/tmp/home
      - HOST_UID=${USER_ID:-1000}
      - HOST_GID=${GROUP_ID:-1000}
    ipc: host
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: /bin/bash
