annotator_note: 'Two annotators from fresh contexts, no access to the scenario file, to each other, or
  to any result. Identical labels (Jaccard 1.000, 27/480), the same contiguous event in episode 0. Both
  independently chose a half-turn (pi rad) as the somersault criterion rather than a full 2*pi, because
  no full rotation occurs and requiring one would label nothing despite an obvious flip. Both noted the
  threshold is not delicate: the largest rising legs per episode are 3.88, 1.96, 1.16 and 1.12 rad, so
  any cut between about 2.1 and 3.8 gives the same labels.

  One annotator flagged v_rooty as inconsistent with the change in rooty. Checked: v_rooty correlates
  0.884 with d(rooty)/dt at a one-step lag, which is the usual MuJoCo convention of reporting the velocity
  after the step. Not a defect, and the labels do not depend on it.'
