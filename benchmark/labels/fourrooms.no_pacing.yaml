  to any result. Identical labels (Jaccard 1.000, 67/720), the same two stretches. Both compressed rows
  into cell-runs so that turning in place is not a move, then required at least two complete out-and-back
  round trips over a segment of at most two cells; single out-and-backs and spinning in place were deliberately
  excluded.

  This entry was previously recorded as unobservable on the strength of a probe that searched for A,B,A
  in CONSECUTIVE steps. That pattern cannot occur in MiniGrid, where turning costs a step and an out-and-back
  reads A,B,B,B,A. The behaviour is present in 2 of 12 episodes here.'
