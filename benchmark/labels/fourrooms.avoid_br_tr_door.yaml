annotator_note: 'Three annotators from fresh contexts, no access to the scenario file, to each other,
  or to any result. All three identified the SAME seven doorway steps in the same six episodes, and the
  doorway column is re-randomised each reset, so the event detection is not in dispute. They differed
  only on how wide ''using the doorway'' is in time: 12, 18 and 29 steps for the doorway cell plus a committing
  step, plus approach and exit, and plus/minus two steps respectively. Pairwise agreement 0.67, 0.41,
  0.62. Stored labels are the per-step majority.

  The description fixes the place but not the duration of the act, which is the only thing the readers
  disagree about.'
