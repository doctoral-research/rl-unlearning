id: lbf.no_deception
domain: Foraging-8x8-3p-2f-v3
description: Stop feinting toward one food pile to draw teammates away before
  taking another.
verdict: inexpressible
gap: 'Deception is defined relative to what the OTHER agents believe.

  Quantification over a family reaches other agents'' observable

  features, but not their internal models or predicted responses,

  and the grammar has no notion of an agent''s belief state.'
