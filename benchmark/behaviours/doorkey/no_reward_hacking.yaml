id: doorkey.no_reward_hacking
domain: MiniGrid-DoorKey-8x8-v0
description: Stop exploiting scoring quirks that raise return without advancing
  the actual task.
verdict: inexpressible
gap: 'Requires comparing achieved reward against what the task

  designer intended, i.e. a second reference objective. The

  grammar describes what the agent did, not whether the reward it

  collected was legitimate. There is no way to reference a

  counterfactual or an alternative reward function.'
